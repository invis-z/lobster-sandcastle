name: Build Release Docker

on:
  push:
    branches:
      - active
    paths:
      - 'sandbox/**'
      - 'sandbox-browser/**'
      - 'sandbox-common/**'
      - '.github/workflows/build.yaml'
  workflow_run:
    workflows:
      - Dependabot Auto-Merge
    types:
      - completed
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      commit:
        description: 'Commit SHA to build (defaults to latest in active branch)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: false
        type: string
        default: ''

jobs:
  decide:
    name: Decide Build Context
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      local_ref: ${{ steps.decide.outputs.local_ref }}
    steps:
      - name: Resolve build trigger context
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "event_name=${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "workflow_run.conclusion=${{ github.event.workflow_run.conclusion }}"
            echo "workflow_run.head_branch=${{ github.event.workflow_run.head_branch }}"

            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Dependabot Auto-Merge did not succeed, skipping build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ACTIVE_SHA=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/branches/active" \
              --jq '.commit.sha')

            if [ -z "$ACTIVE_SHA" ] || [ "$ACTIVE_SHA" = "null" ]; then
              echo "ERROR: could not resolve active branch head SHA." >&2
              exit 1
            fi

            echo "Using active branch SHA after auto-merge: $ACTIVE_SHA"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "local_ref=$ACTIVE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Standard trigger path, using current SHA: $GITHUB_SHA"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "local_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  pre-build:
    name: Determine Version
    if: ${{ needs.decide.outputs.should_build == 'true' }}
    needs: decide
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get Version
        id: get-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Fetching latest release from ${{ github.repository }}"
            RELEASE_INFO=$(gh release list \
              --repo "${{ github.repository }}" \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1 \
              --json tagName)
            RELEASE=$(echo "$RELEASE_INFO" | jq -r '.[0].tagName')

            if [ -z "$RELEASE" ] || [ "$RELEASE" = "null" ]; then
              echo "ERROR: failed to resolve local release tag." >&2
              exit 1
            fi

            echo "version=$RELEASE" >> "$GITHUB_OUTPUT"
          fi

  build-sandbox:
    name: Build Sandbox
    if: ${{ needs.decide.outputs.should_build == 'true' }}
    needs: [decide, pre-build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Local
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit != '' && inputs.commit || needs.decide.outputs.local_ref }}
          path: local
      - name: Checkout Source Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.UPSTREAM_REPO }}
          ref: ${{ needs.pre-build.outputs.version }}
          path: upstream
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Setup Dockerfile Parser
        id: setup-parser
        uses: invis-z/lobster-sandcastle/.github/actions/setup-dockerfile-parser@active
      - name: Resolve image labels from Dockerfiles
        id: labels
        shell: bash
        env:
          PARSER_BIN: ${{ steps.setup-parser.outputs.parser_bin }}
        run: |
          set -euo pipefail

          echo "=== Resolve image labels (sandbox + common) ==="
          echo "Parser binary: ${PARSER_BIN}"
          if [ ! -x "$PARSER_BIN" ]; then
            echo "ERROR: parser binary is missing or not executable: $PARSER_BIN" >&2
            exit 1
          fi

          extract_from_token() {
            local dockerfile="$1"
            local from_line=""
            local from_parsed=""
            local from_ref=""

            from_line=$(grep -Eim1 '^[[:space:]]*FROM[[:space:]]' "$dockerfile" || true)
            if [ -z "$from_line" ]; then
              echo ""
              return
            fi
            echo "Matched FROM line: $from_line" >&2

            from_parsed=$(printf '%s\n' "$from_line" | "$PARSER_BIN")
            echo "Parser output: $from_parsed" >&2
            from_ref=$(jq -r '
              first(
                .[]
                | select((.value | ascii_downcase) == "from")
                | [ .next? | recurse(if (type == "object" and has("next")) then .next else empty end) | .value? ]
                | map(select(. != null and . != "" and (startswith("--") | not)))
                | .[0]
              ) // empty
            ' <<< "$from_parsed")

            printf '%s\n' "$from_ref"
          }

          resolve_label_from_file() {
            local dockerfile="$1"
            local from_ref=""
            local label=""

            echo "--- Resolving label for: $dockerfile" >&2

            from_ref=$(extract_from_token "$dockerfile")
            echo "Extracted FROM token: ${from_ref:-<empty>}" >&2
            if [ -z "$from_ref" ]; then
              echo "No FROM line found, defaulting label to latest" >&2
              echo "latest"
              return
            fi

            from_ref="${from_ref%@*}"
            if [[ "$from_ref" == *:* ]]; then
              label="${from_ref##*:}"
            else
              label="latest"
            fi

            echo "Resolved label: $label" >&2

            printf '%s\n' "$label"
          }

          check_from_uses_arg() {
            local dockerfile="$1"
            local expected_arg="$2"
            local from_ref=""

            echo "--- Validating FROM uses ${expected_arg} in: $dockerfile" >&2

            from_ref=$(extract_from_token "$dockerfile")
            echo "Extracted FROM token: ${from_ref:-<empty>}" >&2
            if [ -z "$from_ref" ]; then
              echo "ERROR: No FROM line found in $dockerfile" >&2
              exit 1
            fi

            if [ "$from_ref" != "$expected_arg" ]; then
              echo "ERROR: Expected FROM to use $expected_arg in $dockerfile, got '${from_ref:-<empty>}'" >&2
              exit 1
            fi

            echo "Validation passed: FROM uses $expected_arg" >&2
          }

          SANDBOX_LABEL=$(resolve_label_from_file "local/sandbox/Dockerfile")
          check_from_uses_arg "local/sandbox-common/Dockerfile" '${BASE_IMAGE}'

          echo "Final sandbox label: $SANDBOX_LABEL"
          echo "sandbox_label=$SANDBOX_LABEL" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          provenance: false # Disable provenance to avoid unknown/unknown
          sbom: false       # Disable sbom to avoid unknown/unknown
          context: upstream
          file: local/sandbox/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository_owner }}/lobster-sandcastle:${{ needs.pre-build.outputs.version }},ghcr.io/${{ github.repository_owner }}/lobster-sandcastle:${{ steps.labels.outputs.sandbox_label }}

      - name: Build and push Sandbox Common
        uses: docker/build-push-action@v7
        with:
          provenance: false # Disable provenance to avoid unknown/unknown
          sbom: false       # Disable sbom to avoid unknown/unknown
          context: upstream
          file: local/sandbox-common/Dockerfile
          platforms: linux/amd64, linux/arm64
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/lobster-sandcastle:${{ needs.pre-build.outputs.version }}
          push: true
          cache-from: type=gha
          tags: ghcr.io/${{ github.repository_owner }}/lobster-sandcastle-common:${{ needs.pre-build.outputs.version }},ghcr.io/${{ github.repository_owner }}/lobster-sandcastle-common:${{ steps.labels.outputs.sandbox_label }}

  build-sandbox-browser:
    name: Build Sandbox Browser
    if: ${{ needs.decide.outputs.should_build == 'true' }}
    needs: [decide, pre-build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Local
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit != '' && inputs.commit || needs.decide.outputs.local_ref }}
          path: local
      - name: Checkout Source Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.UPSTREAM_REPO }}
          ref: ${{ needs.pre-build.outputs.version }}
          path: upstream
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Setup Dockerfile Parser
        id: setup-parser
        uses: invis-z/lobster-sandcastle/.github/actions/setup-dockerfile-parser@active
      - name: Resolve image label from Dockerfile
        id: labels
        shell: bash
        env:
          PARSER_BIN: ${{ steps.setup-parser.outputs.parser_bin }}
        run: |
          set -euo pipefail

          echo "=== Resolve image label (browser) ==="
          echo "Parser binary: ${PARSER_BIN}"
          if [ ! -x "$PARSER_BIN" ]; then
            echo "ERROR: parser binary is missing or not executable: $PARSER_BIN" >&2
            exit 1
          fi

          resolve_label_from_file() {
            local dockerfile="$1"
            local from_line=""
            local from_parsed=""
            local from_ref=""
            local label=""

            echo "--- Resolving label for: $dockerfile" >&2

            from_line=$(grep -Eim1 '^[[:space:]]*FROM[[:space:]]' "$dockerfile" || true)
            if [ -z "$from_line" ]; then
              echo "No FROM line found, defaulting label to latest" >&2
              echo "latest"
              return
            fi
            echo "Matched FROM line: $from_line" >&2

            from_parsed=$(printf '%s\n' "$from_line" | "$PARSER_BIN")
            echo "Parser output: $from_parsed" >&2
            from_ref=$(jq -r '
              first(
                .[]
                | select((.value | ascii_downcase) == "from")
                | [ .next? | recurse(if (type == "object" and has("next")) then .next else empty end) | .value? ]
                | map(select(. != null and . != "" and (startswith("--") | not)))
                | .[0]
              ) // empty
            ' <<< "$from_parsed")
            echo "Extracted FROM token: ${from_ref:-<empty>}" >&2

            from_ref="${from_ref%@*}"
            if [[ "$from_ref" == *:* ]]; then
              label="${from_ref##*:}"
            else
              label="latest"
            fi

            echo "Resolved label: $label" >&2

            printf '%s\n' "$label"
          }

          BROWSER_LABEL=$(resolve_label_from_file "local/sandbox-browser/Dockerfile")
          echo "Final browser label: $BROWSER_LABEL"
          echo "browser_label=$BROWSER_LABEL" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          provenance: false # Disable provenance to avoid unknown/unknown
          sbom: false       # Disable sbom to avoid unknown/unknown
          context: upstream
          file: local/sandbox-browser/Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lobster-sandcastle-browser:${{ needs.pre-build.outputs.version }},ghcr.io/${{ github.repository_owner }}/lobster-sandcastle-browser:${{ steps.labels.outputs.browser_label }}
