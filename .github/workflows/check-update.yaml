name: Check Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write
  packages: write

jobs:
  check-update:
    name: Check Update
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-upstream-release.outputs.release }}
      local_version: ${{ steps.get-release.outputs.release }}
      need_update: ${{ steps.newer.outputs.need_update }}
    steps:
      - name: Get Upstream release
        id: get-upstream-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE=$(gh release list \
            --repo "${{ vars.UPSTREAM_REPO }}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')
          echo "Upstream release: $RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
      - name: Get latest release
        id: get-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE=$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // empty')
          if [ -z "$RELEASE" ]; then
            echo "No local release found, will treat all files as changed."
          else
            echo "Local release: $RELEASE"
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
      - name: Version is different
        if: ${{ steps.get-upstream-release.outputs.release != steps.get-release.outputs.release }}
        id: newer
        run: |
          echo need_update=true >> "$GITHUB_OUTPUT"

  refresh-dockerfiles:
    name: Refresh Dockerfiles
    needs: check-update
    if: ${{ needs.check-update.outputs.need_update == 'true' }}
    uses: invis-z/lobster-sandcastle/.github/workflows/refresh-dockerfiles.yaml@active
    with:
      version: ${{ needs.check-update.outputs.version }}
      local_version: ${{ needs.check-update.outputs.local_version }}

  build-lobster:
    name: Build Lobster
    needs: [check-update, create-release]
    if: ${{ needs.check-update.outputs.need_update == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.UPSTREAM_REPO }}
          ref: ${{ needs.check-update.outputs.version }}
          path: upstream
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Build and push Lobster image
        uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: upstream
          platforms: linux/amd64, linux/arm64
          build-args: |
            OPENCLAW_DOCKER_BUILD_NODE_OPTIONS="--max-old-space-size=4096"
            OPENCLAW_INSTALL_DOCKER_CLI=1
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lobster:${{ needs.check-update.outputs.version }},ghcr.io/${{ github.repository_owner }}/lobster:latest
      - name: Build and push Lobster slim image
        uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: upstream
          platforms: linux/amd64, linux/arm64
          build-args: |
            OPENCLAW_DOCKER_BUILD_NODE_OPTIONS="--max-old-space-size=4096"
            OPENCLAW_INSTALL_DOCKER_CLI=1
            OPENCLAW_VARIANT=slim
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lobster:${{ needs.check-update.outputs.version }}-slim,ghcr.io/${{ github.repository_owner }}/lobster:latest-slim

  build:
    name: Build
    needs: [check-update, refresh-dockerfiles, create-release]
    if: ${{ always() && needs.check-update.outputs.need_update == 'true' && needs.refresh-dockerfiles.outputs.changed == 'true' }}
    uses: invis-z/lobster-sandcastle/.github/workflows/build.yaml@active
    with:
      version: ${{ needs.check-update.outputs.version }}
      commit: ${{ needs.refresh-dockerfiles.outputs.commit_sha }}

  create-release:
    name: Create Release
    needs: [check-update, refresh-dockerfiles]
    if: ${{ always() && needs.check-update.outputs.need_update == 'true' && needs.refresh-dockerfiles.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release for upstream version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.check-update.outputs.version }}"

          echo "=== Creating Release ==="
          echo "VERSION: $VERSION"
          echo "REPOSITORY: ${{ github.repository }}"

          RELEASE_EXISTS=false
          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi
          echo "Release exists: $RELEASE_EXISTS"

          TARGET_SHA="${{ needs.refresh-dockerfiles.outputs.commit_sha }}"
          if [ -z "$TARGET_SHA" ] || [ "$TARGET_SHA" = "null" ]; then
            echo "No commit created during refresh; resolving active branch head for release target."
            TARGET_SHA=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/branches/active" \
              --jq '.commit.sha')
          fi

          if [ -z "$TARGET_SHA" ] || [ "$TARGET_SHA" = "null" ]; then
            echo "ERROR: failed to resolve release target SHA." >&2
            exit 1
          fi

          if [ "$RELEASE_EXISTS" = "true" ]; then
            echo "Updating existing release tag $VERSION to target: $TARGET_SHA"
            if gh api --method PATCH \
              "/repos/${{ github.repository }}/git/refs/tags/$VERSION" \
              -f sha="$TARGET_SHA" \
              -F force=true > /dev/null 2>&1; then
              echo "Tag ref updated via PATCH"
            else
              echo "PATCH tag ref failed, recreating tag ref"
              gh api --method DELETE \
                "/repos/${{ github.repository }}/git/refs/tags/$VERSION" \
                > /dev/null 2>&1 || true
              gh api --method POST \
                "/repos/${{ github.repository }}/git/refs" \
                -f ref="refs/tags/$VERSION" \
                -f sha="$TARGET_SHA" \
                > /dev/null
              echo "Tag ref recreated"
            fi

            gh release edit "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "$VERSION" \
              --notes "Synced from upstream $VERSION"

            echo "Release updated successfully"
          else
            echo "Creating release $VERSION at target: $TARGET_SHA"
            gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "$VERSION" \
              --notes "Synced from upstream $VERSION" \
              --latest

            echo "Release created successfully"
          fi

  clean-history:
    name: Clean History
    needs: check-update
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Clean old runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_NAME=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          echo "Cleaning old $WORKFLOW_NAME runs"
          RUNS=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "$WORKFLOW_NAME" \
            --limit 2000 \
            --json databaseId,createdAt \
            --jq ".[] | select(.createdAt | fromdateiso8601 < $(date -d 'last month' +%s)) | .databaseId")

          for RUN in $RUNS; do
            echo "Deleting run $RUN"
            gh run delete "$RUN" \
              --repo "${{ github.repository }}"
            sleep 0.1
          done
